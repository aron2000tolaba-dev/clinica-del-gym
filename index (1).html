<style>
/* Layout: una columna de app de celular (máx. 560px), cabecera azul marino, barra de navegación fija abajo. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#F0F1EE; --line:#E1E5E2;
  --ink:#14201C; --ink-2:#3E4A46; --muted:#5A6863;
  --navy:#172338; --navy-2:#23324D; --navy-ink:#FFFFFF; --navy-muted:#B9C4D8;
  --accent:#FF8A3D; --accent-ink:#2A1400;
  --blue:#2B5FB8; --blue-soft:#E8EEF8; --blue-ink:#1D4F91;
  --good-soft:#E3F7EC; --good-ink:#0E6B44;
  --warn-soft:#FFF0E5; --warn-ink:#A3430A;
  --bad-soft:#FDE7E4; --bad-ink:#A4231A;
  --note-soft:#FFF7D6; --note-ink:#5C4400;
  --font:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --surface:#18202F; --surface-2:#222B3C; --line:#2C3648;
  --ink:#EEF1F6; --ink-2:#C9D1DD; --muted:#9AA6B8;
  --navy:#0B1220; --navy-2:#1C2740; --navy-ink:#FFFFFF; --navy-muted:#9FAAC0;
  --accent:#FF9550; --accent-ink:#241000;
  --blue:#6E9BEA; --blue-soft:#1E2C47; --blue-ink:#A9C4F5;
  --good-soft:#143326; --good-ink:#7FD9A8;
  --warn-soft:#3A2414; --warn-ink:#FFB27D;
  --bad-soft:#3D1A18; --bad-ink:#FF9C93;
  --note-soft:#332A0E; --note-ink:#F2D27A;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#18202F; --surface-2:#222B3C; --line:#2C3648;
  --ink:#EEF1F6; --ink-2:#C9D1DD; --muted:#9AA6B8;
  --navy:#0B1220; --navy-2:#1C2740; --navy-ink:#FFFFFF; --navy-muted:#9FAAC0;
  --accent:#FF9550; --accent-ink:#241000;
  --blue:#6E9BEA; --blue-soft:#1E2C47; --blue-ink:#A9C4F5;
  --good-soft:#143326; --good-ink:#7FD9A8;
  --warn-soft:#3A2414; --warn-ink:#FFB27D;
  --bad-soft:#3D1A18; --bad-ink:#FF9C93;
  --note-soft:#332A0E; --note-ink:#F2D27A;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:var(--navy-ink);padding-block:16px 18px;display:flex;flex-direction:column;gap:10px}
.kicker{font-size:12px;font-weight:700;color:var(--navy-muted);letter-spacing:.06em;text-transform:uppercase}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.15;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:800}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.main{flex:1;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.b{font-weight:800} .num{font-variant-numeric:tabular-nums}
.btn{min-height:48px;border-radius:14px;border:0;padding:0 16px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-dark{background:var(--navy);color:var(--navy-ink)}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-wa{background:var(--good-soft);color:var(--good-ink)}
.btn-big{min-height:58px;font-size:17px;border-radius:16px;width:100%}
.btn-sm{min-height:40px;font-size:14px;border-radius:12px;padding:0 12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hdr-btn{min-height:44px;border-radius:12px;border:1.5px solid #4A5874;background:transparent;color:var(--navy-ink);padding:0 14px;font-weight:700}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;background:none;border:0;color:var(--navy-ink);font-weight:700;font-size:15px;padding:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;white-space:nowrap}
.chip.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:3px 9px;border-radius:8px;white-space:nowrap}
.p-blue{background:var(--blue-soft);color:var(--blue-ink)} .p-good{background:var(--good-soft);color:var(--good-ink)}
.p-warn{background:var(--warn-soft);color:var(--warn-ink)} .p-bad{background:var(--bad-soft);color:var(--bad-ink)}
.p-gray{background:var(--surface-2);color:var(--ink-2)} .p-note{background:var(--note-soft);color:var(--note-ink)}
.note{background:var(--note-soft);color:var(--note-ink);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.4}
.warnbox{background:var(--warn-soft);border:2px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.avatar{width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;background:var(--blue-soft);color:var(--blue-ink)}
label.f{display:flex;flex-direction:column;gap:6px}
label.f>span{font-size:14px;font-weight:700;color:var(--ink-2)}
.in{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;width:100%}
textarea.in{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.4}
.in.alert{border-color:var(--accent);border-width:2px}
.search{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 14px;background:var(--surface);border-radius:14px;border:1.5px solid var(--line);color:var(--muted)}
.search input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:16px;color:var(--ink)}
.list{background:var(--surface);border-radius:16px;padding:2px 14px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.tabs{display:grid;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) -18px}
.tab{min-height:50px;border:0;background:transparent;color:var(--navy-muted);font-weight:800;font-size:15px;border-bottom:4px solid transparent}
.tab.on{color:var(--navy-ink);border-bottom-color:var(--accent)}
nav.bottom{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:700}
nav.bottom button.on{color:var(--blue);font-weight:800}
.stockbox{width:62px;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.stockbox b{font-size:21px;line-height:1}
.stockbox span{font-size:10px;font-weight:800;text-transform:uppercase}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px}
.dot{width:22px;height:22px;border-radius:11px;border:3px solid var(--line);background:var(--surface);flex-shrink:0}
.dot.done{background:var(--blue);border-color:var(--blue)} .dot.now{border-color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:86%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sh{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.sheet .sb{overflow:auto;padding-block:4px 16px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:12px 18px;border-radius:14px;font-weight:800;z-index:60;max-width:90%;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.key{min-height:62px;border-radius:16px;border:0;background:var(--navy-2);color:var(--navy-ink);font-size:24px;font-weight:800}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.photos img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;max-width:100%}
.ph{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:13px;border:0}
.doc{background:#FFFFFF;color:#111111;border-radius:6px;padding:22px 18px;font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:12px;overflow-x:auto}
.doc .brand{font-size:24px;font-weight:800;letter-spacing:.5px}
.doc .brand i{font-style:normal;color:#D7261E}
.doc table{width:100%;border-collapse:collapse;font-size:13px;min-width:300px}
.doc th{background:#111111;color:#FFFFFF;text-align:left;padding:7px 8px;font-size:11px}
.doc td{padding:8px;border-bottom:1px solid #BBBBBB}
.doc .r{text-align:right}
.doc .box{border:1.5px solid #111111;padding:10px}
.doc .lbl{font-size:10px;font-weight:800;color:#555555;text-transform:uppercase}
/* hoja A4: el documento se arma a 794 px (ancho A4) y en pantalla se ve achicado */
.hoja-wrap{width:100%;overflow:hidden;position:relative;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.hoja-wrap>.doc,.hoja-pdf>.doc{width:794px;min-height:1123px;max-width:none;transform-origin:0 0;border-radius:0;padding:44px 52px;font-size:14px;overflow:visible;box-sizing:border-box}
.hoja-wrap>.doc table,.hoja-pdf>.doc table{font-size:13.5px}
.hoja-aviso{font-size:12px;font-weight:800;color:var(--warn-ink)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-weight:600;line-height:1.5}
.stars{color:#C4520E;letter-spacing:1px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
/* ===== Vista de escritorio (pantallas anchas) ===== */
@media (min-width: 1000px){
  #app{max-width:none;margin:0}
  #app:has(nav.bottom){padding-left:232px}
  header.top.gut,.main.gut,form.main.gut{padding-left:max(36px,calc((100% - 980px) / 2));padding-right:max(36px,calc((100% - 980px) / 2))}
  .tabs{margin:0 0 -18px}
  h1{font-size:30px}
  nav.bottom{position:fixed;left:0;top:0;bottom:0;width:232px;display:flex;flex-direction:column;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line);z-index:35}
  nav.bottom::before{content:"CLÍNICA DEL GYM";font-weight:800;font-size:17px;letter-spacing:.5px;padding:6px 12px 18px;color:var(--ink)}
  nav.bottom button{flex-direction:row;justify-content:flex-start;gap:14px;padding:12px 14px;border-radius:12px;font-size:15px}
  nav.bottom button.on{background:var(--blue-soft)}
  nav.bottom button:hover{background:var(--surface-2)}
  .main > .list, .main > .card{max-width:100%}
  .sheet{max-width:640px;border-radius:22px;margin-bottom:6vh}
  .sheet-bg{align-items:center}
  #toast{bottom:28px;left:calc(50% + 116px)}
  #sync-pill{bottom:24px;left:calc(50% + 116px)}
  .vista-escritorio-2col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
}
#sync-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:60;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.22);max-width:92vw;text-align:center}
.sync-off{background:#5C4400;color:#FFF7D6}.sync-up{background:#172338;color:#FFFFFF}
</style>

function migrarNumeros(db){
  migrarAgenda(db); migrarSalta(db); migrarSalta2(db); migrarMapa(db); migrarExtras(db); migrarHilux(db);
  db.config.interes = db.config.interes ?? 5;
  db.gastos.forEach(g => { g.tipo = g.tipo || 'gasto'; });
  if(db.ejemplosNum) return;
  db.ejemplosNum = true;
  const ej = [['ingreso','Alquiler cobrado','Alquiler de viviendas',900000],['ingreso','Alquiler cobrado','Alquiler de máquinas',420000],['ingreso','Abono mensual','Sistemas mensuales',350000],

  const factores = [0.7,0.8,0.9,0.85,0.95,1];
  factores.forEach((fx, k) => { const d = new Date(); d.setDate(10); d.setMonth(d.getMonth() - (5 - k));

}

/* Recibo común: sin IVA. Factura o tarjeta: con IVA. Tarjeta además suma el recargo. */
function totales(o){
  const cf = repo.db.config, tarjeta = o.medioPago === 'Tarjeta';
  const sub = o.pres.items.reduce((s, x) => s + x.precio * x.cant, 0);
  const iva = (o.comp === 'Factura' || tarjeta) ? sub * cf.iva / 100 : 0;
  const garExt = o.garExt ? o.garExt.precio : 0, deposito = depositoDe(o);
  const base = sub + iva + (o.transporte || 0) + garExt + deposito;
  const recargo = tarjeta ? base * (cf.recargoTarjeta || 0) / 100 : 0, total = base + recargo;
  const cobrado = o.cobros.reduce((s, c) => s + c.monto, 0);
  return {sub, iva, garExt, deposito, recargo, total, cobrado, falta: Math.max(0, total - cobrado)};
}

function initFirma(){
  const cv = $('#firma-pad'); if(!cv || cv.dataset.ok) return; cv.dataset.ok = '1';
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111111';
  let dib = false; cv.dataset.vacio = '1';
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener('pointerdown', e => { dib = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); g.beginPath(); g.moveTo(x, y); g.lineTo(x + .1, y + .1); g.stroke(); cv.dataset.vacio = ''; e.preventDefault(); });
  cv.addEventListener('pointermove', e => { if(!dib) return; const [x, y] = pt(e); g.lineTo(x, y); g.stroke(); e.preventDefault(); });
  const fin = () => { dib = false; }; cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
}
function firmaRecortada(cv){
  const g = cv.getContext('2d'), {width:w, height:h} = cv, d = g.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for(let y = 0; y < h; y += 2) for(let x = 0; x < w; x += 2) if(d[(y * w + x) * 4 + 3] > 20){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
  if(x1 <= x0) return null; const m = 8; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w, x1 + m); y1 = Math.min(h, y1 + m);
  const k = Math.min(1, 360 / (x1 - x0)), c2 = document.createElement('canvas'); c2.width = (x1 - x0) * k; c2.height = (y1 - y0) * k;
  c2.getContext('2d').drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, c2.width, c2.height); return c2.toDataURL('image/png');
}

V.inicio = () => {

  const enviados = db.ordenes.filter(o => o.pres.estado === 'Enviado');
  const listos = db.ordenes.filter(o => o.estado === 'Listo');

  const deben = db.ordenes.filter(o => o.estado === 'Entregado' && totales(o).falta > 0);
  const debeTotal = db.ordenes.reduce((s,o) => s + (o.pres.estado==='Aprobado' ? totales(o).falta : 0), 0);

      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="b">${titulo}</span><span class="small muted">${det}</span></span>${ic('chev',20,2.4)}</button>`;
  return header({kicker:'Clínica del Gym', titulo:`Hola, ${esc(S.user.nombre)}`, derecha:`<span class="avatar" style="background:var(--accent);color:var(--accent-ink);width:42px;height:42px">${esc(S.user.ini)}</span>`,
    extra:`<span style="color:var(--navy-muted);font-weight:600">${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</span>
    <div class="grid3" style="margin-top:4px">
      <button class="btn btn-main" style="min-height:70px;flex-direction:column;gap:2px" data-a="nuevoCliente">${ic('plus',22,2.6)}Nuevo cliente</button>
      <button class="btn" style="min-height:70px;flex-direction:column;gap:2px;background:var(--navy-2);color:var(--navy-ink)" data-a="nav" data-v="clientes">${ic('clientes',22)}Buscar cliente</button>
      <button class="btn" style="min-height:70px;flex-direction:column;gap:2px;background:var(--navy-2);color:var(--navy-ink)" data-a="nuevoGasto">${ic('gasto',22)}Cargar gasto</button>
    </div>`}) +
  `<div class="main gut">${S.user.rol !== 'admin' ? ficharCard() : ''}<h2>Para atender hoy</h2>
    ${(() => { const n = avisosLista().length; return n ? fila(n, 'Avisos', 'Fechas, seguimientos, retiros y más', 'verAvisos', 'p-warn') : ''; })()}
    ${(() => { const r = rutaDe(hoyStr()); const n = r.paradas.length + r.sinCoord.length; return n ? fila(n, 'Paradas en la ruta de hoy', fmtKm(r.total) + ' · ' + [...new Set(r.paradas.map(x => x.c.localidad))].join(', '), 'verAgenda', 'p-blue') : ''; })()}
    ${listos.length ? fila(listos.length,'Equipos listos para entregar','Avisar al cliente y cobrar','verOrdenes','p-warn') : ''}
    ${enviados.length ? fila(enviados.length,'Presupuestos esperando aprobación','Enviados por WhatsApp','verOrdenes','p-note') : ''}
    ${fila(enCurso.length,'Órdenes en curso','Ingresadas, presupuestadas o en reparación','verOrdenes','p-blue')}
    ${bajos.length ? fila(bajos.length,'Repuestos con stock bajo','Armar el pedido al proveedor','verProveedores','p-bad') : ''}
    ${esAdmin() ? (() => { const mv = movimientosMes(0); const g = mv.ing.reduce((s,x)=>s+x.monto,0) - mv.gas.reduce((s,x)=>s+x.monto,0); return `<button class="card" data-a="verNumeros" style="border:0;text-align:left;background:var(--navy);color:var(--navy-ink)"><span class="kicker">Solo lo ves vos</span><span class="small" style="color:var(--navy-muted);font-weight:700">Ganancia del mes hasta hoy</span><span class="num" style="font-size:28px;font-weight:800">${plata(g)}</span>${debeTotal?`<span class="small b" style="color:var(--accent)">Te deben ${plata(debeTotal)}</span>`:''}<span class="small b">Ver números ›</span></button>`; })() : ''}
    <div class="note">Conectado a la nube: lo que cargás lo ven todos al instante, y sin señal se guarda en el celular hasta que vuelve.</div>
  </div>` + nav();
};

V.ordenes = () => {
  const f = S.filtro.ord || 'Abiertas';

  if(f === 'Abiertas') lista = lista.filter(o => o.estado !== 'Entregado');
  else if(f !== 'Todas') lista = lista.filter(o => o.estado === f);
  return header({titulo:'Órdenes', atras:'Inicio'}) + `<div class="main gut">
    <div class="chips">${['Abiertas','Presupuestado','En reparación','Listo','Entregado','Todas'].map(x => `<button class="chip ${x===f?'on':''}" data-a="filtro" data-k="ord" data-v="${x}">${x}</button>`).join('')}</div>
    ${lista.length ? lista.map(cardOrden).join('') : `<div class="empty">No hay órdenes en este estado.</div>`}

function cardOrden(o){
  const c = repo.cliente(o.clienteId) || {}; const e = repo.equipo(o.equipoId) || {};

}

V.clientes = () => {

  let lista = repo.db.clientes.slice().sort((a,b) => a.nombre.localeCompare(b.nombre));
  if(f !== 'Todos') lista = lista.filter(c => c.tipo === f);
  if(q) lista = lista.filter(c => norm(c.nombre).includes(q) || digitos(c.tel).includes(digitos(q) || '§') || digitos(c.doc).includes(digitos(q) || '§') || norm(c.localidad).includes(q) || norm(c.dir).includes(q));
  return header({kicker:'Clínica del Gym', titulo:'Clientes', derecha:`<span class="row" style="gap:8px"><button class="hdr-btn" data-a="verMapa" aria-label="Mapa de clientes">Mapa</button><button class="btn btn-main btn-sm" data-a="nuevoCliente">${ic('plus',18,2.6)} Nuevo</button></span>`,
    extra:`<label class="search" style="margin-top:4px">${ic('search',20,2)}<input id="q-cli" type="search" placeholder="Nombre, DNI, teléfono o zona" value="${esc(S.q.cli||'')}" data-in="q" data-k="cli" autocomplete="off"></label>`}) +
  `<div class="main gut">
    <div class="chips">${['Todos','Particular','Gimnasio','Fisioterapia'].map(x => `<button class="chip ${x===f?'on':''}" data-a="filtro" data-k="cli" data-v="${x}">${x}${x==='Todos'?' · '+repo.db.clientes.length:''}</button>`).join('')}</div>
    ${lista.length ? lista.map(c => {
      const ult = repo.ordenesDe(c.id)[0];
      return `<div class="card">
        <div class="row" style="align-items:flex-start;gap:12px">
          <button data-a="ficha" data-id="${c.id}" style="all:unset;cursor:pointer;display:flex;gap:12px;flex:1;min-width:0">
            <span class="avatar">${iniciales(c.nombre)}</span>
            <span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span class="b" style="font-size:17px">${esc(c.nombre)}</span>
            <span class="small muted">${esc([c.dir,c.localidad].filter(Boolean).join(' · '))}</span>
            <span class="row" style="gap:8px"><span class="pill p-blue">${esc(c.tipo)}</span><span class="stars small">${estrellas(c.estrellas)}</span></span></span>
          </button>
          <a class="btn btn-main" style="width:50px;min-height:50px;padding:0;border-radius:25px" href="${mapsLink(c)}" target="_blank" rel="noopener" aria-label="Cómo llegar con Google Maps">${ic('pin',24,2.4)}</a>
        </div>
        ${ult ? `<div class="small" style="background:var(--surface-2);border-radius:10px;padding:8px 12px;color:var(--ink-2)">Orden #${ult.num} · ${esc(ult.estado)}</div>` : ''}
        <div class="grid2"><a class="btn btn-wa btn-sm" href="${waLink(c.tel,'Hola '+c.nombre.replace(' (ejemplo)','')+', te escribimos de Clínica del Gym.')}" target="_blank" rel="noopener">WhatsApp</a><button class="btn btn-soft btn-sm" data-a="ficha" data-id="${c.id}">Ver ficha</button></div>
      </div>`;}).join('') : `<div class="empty">No encontramos clientes con "${esc(S.q.cli||'')}".<br><button class="btn btn-main" style="margin-top:12px" data-a="nuevoCliente">Cargarlo como nuevo</button></div>`}
  </div>` + nav();
};

function duplicados(d, ignorarId){
  const tel = digitos(d.tel), doc = digitos(d.doc), n = norm(d.nombre);
  return repo.db.clientes.filter(c => c.id !== ignorarId).map(c => {
    const motivos = [];
    if(tel.length >= 7 && digitos(c.tel).slice(-7) === tel.slice(-7)) motivos.push('mismo teléfono');
    if(doc.length >= 6 && digitos(c.doc) === doc) motivos.push('mismo DNI/CUIT');
    const cn = norm(c.nombre);
    if(n.length >= 5 && (cn === n || lev(cn, n) <= 2)) motivos.push('nombre parecido');
    return motivos.length ? {c, motivos} : null;
  }).filter(Boolean);
}

function dupBox(dups){
  if(!dups.length) return '';
  return dups.slice(0,2).map(({c, motivos}) => `<div class="warnbox" style="margin-bottom:8px">
    <span class="b" style="color:var(--warn-ink)">Este cliente ya podría existir (${motivos.join(', ')})</span>
    <div class="row card" style="flex-direction:row;padding:10px"><span class="avatar">${iniciales(c.nombre)}</span><span style="display:flex;flex-direction:column"><span class="b">${esc(c.nombre)}</span><span class="small muted">${esc(c.tel)} · ${esc(c.localidad)}</span></span></div>

}

V.orden = () => {

};
function ordenTab(o, c){

    <div class="card"><h2>Falla informada</h2><span style="font-weight:600;color:var(--ink-2);line-height:1.45">${esc(o.falla || 'Sin detalle')}</span>${o.estadoIngreso?`<span class="small muted b">Al ingresar: ${esc(o.estadoIngreso)}</span>`:''}</div>
    ${fechaCard(o)}
    <div class="card"><h2>Seguimiento</h2><div class="steps">${ESTADOS.map((s,i) => `<div class="step"><span class="dot ${i<idx?'done':i===idx?'now':''}"></span><span style="flex:1;font-weight:${i===idx?800:i<idx?700:600};color:${i>idx?'var(--muted)':'var(--ink)'}">${s}</span></div>`).join('')}</div>

    ${o.modalidad !== 'Lo trae' && o.estado !== 'Entregado' ? (() => { const v = repo.db.visitas.find(x => x.ordenId === o.id && x.estado !== 'Terminado'); return v ? `<button class="btn btn-soft" data-a="dia" data-v="${v.fecha}">${esc(v.tipo)} agendado: ${diaLargo(v.fecha)}</button>` : `<button class="btn btn-main" data-a="agendarOrden" data-id="${o.id}">Agendar ${o.estado === 'Listo' ? 'entrega' : 'retiro'}</button>`; })() : ''}
    ${(() => { const m = modeloDeEquipo(repo.equipo(o.equipoId)); return m ? `<button class="btn btn-line" data-a="abrirModelo" data-id="${m.id}">Ficha técnica y qué llevar · ${esc(m.marca)} ${esc(m.modelo)}</button>` : ''; })()}
    ${condicionesCard()}
    <button class="btn btn-line" data-a="vistaCliente" data-id="${o.id}">Ver lo que ve el cliente</button>
    <div class="grid2"><button class="btn btn-soft" data-a="doc" data-v="ingreso" data-id="${o.id}">Ver orden de ingreso</button>
    <a class="btn btn-wa" href="${waLink(c.tel, textoIngreso(o))}" target="_blank" rel="noopener">Enviar por WhatsApp</a></div>`;
}
function presTab(o, c){
  const tt = totales(o), dm = demoraOrden(o), aprobado = o.pres.estado === 'Aprobado';
  return `<div class="list">${o.pres.items.length ? o.pres.items.map((x,i) => { const it = itemDe(x) || {nombre:'Ítem borrado', tipo:'servicio'};
      const sin = conStock(it) && it.stock < x.cant && !(aprobado && x.reservado);
      return `<div class="li" style="flex-wrap:wrap">
        <span style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px"><span class="b">${esc(it.nombre)}</span>
          <span class="tiny b" style="color:${it.tipo==='servicio'?'var(--blue-ink)':sin?'var(--bad-ink)':'var(--warn-ink)'}">${it.tipo==='servicio'?'Servicio':sin?'Sin stock · demora ± '+((repo.prov(it.prov)||{}).demora||repo.db.config.demoraDefecto)+' días':(it.ctrl===false?'Repuesto':'Repuesto · quedan '+it.stock)}</span></span>
        <span class="row" style="gap:6px">${aprobado?`<span class="b num">${x.cant} ×</span>`:`<button class="btn btn-soft" style="width:38px;min-height:38px;padding:0" data-a="cant" data-i="${i}" data-v="-1" aria-label="Uno menos">−</button><span class="b num" style="width:22px;text-align:center">${x.cant}</span><button class="btn btn-soft" style="width:38px;min-height:38px;padding:0" data-a="cant" data-i="${i}" data-v="1" aria-label="Uno más">+</button>`}</span>
        ${!x.itemId && !aprobado ? `<input class="in num" style="width:110px;text-align:right" inputmode="numeric" value="${x.precio||''}" placeholder="Precio" data-in="precioLinea" data-i="${i}">` : `<span class="b num" style="min-width:96px;text-align:right">${plata(x.precio*x.cant)}</span>`}</div>`;}).join('') : `<div class="empty" style="padding:16px">Todavía no hay ítems. Agregalos desde el inventario.</div>`}
      ${aprobado ? '' : `<button class="btn" style="width:100%;margin:10px 0;border:1.5px dashed var(--blue);background:var(--blue-soft);color:var(--blue-ink)" data-a="agregarItem">+ Agregar ítem del inventario</button>`}</div>
    ${o.pres.items.some(x => !(x.precio > 0)) && !aprobado ? '<span class="small b" style="color:var(--warn-ink)">Poné el precio de los ítems que vinieron de la revisión para poder aprobarlo.</span>' : ''}
    ${(() => { const r = resumenCheck(o); return r ? `<span class="small muted b">Revisión: ${r.bien} bien${r.desg.length ? ' · desgastado: ' + esc(r.desg.join(', ').toLowerCase()) : ''}${r.camb.length ? ' · a cambiar: ' + esc(r.camb.join(', ').toLowerCase()) : ''}</span>` : ''; })()}
    ${dm.dias ? `<div class="warnbox"><span class="b" style="color:var(--warn-ink)">${dm.faltan.map(f=>esc(f.it.nombre)).join(', ')} no ${dm.faltan.length>1?'están':'está'} en stock</span><span class="small b" style="color:var(--ink-2)">El trabajo tiene una demora estimada de ± ${dm.dias} días. Entrega estimada: ${sumarDias(dm.dias+2).toLocaleDateString('es-AR')}. ${aprobado?'Ya quedó en el pedido al proveedor.':'Al aprobar se suma solo al pedido del proveedor.'}</span></div>` : ''}
    <div class="card">
      <div class="between"><span class="muted b">Subtotal</span><span class="num b">${plata(tt.sub)}</span></div>
      ${tt.iva?`<div class="between"><span class="muted b">IVA ${repo.db.config.iva} % (${o.comp==='Factura'?'con factura':'pago con tarjeta'})</span><span class="num b">${plata(tt.iva)}</span></div>`:''}
      ${tt.recargo?`<div class="between"><span class="muted b">Recargo tarjeta</span><span class="num b">${plata(tt.recargo)}</span></div>`:''}
      ${o.transporte?`<div class="between"><span class="muted b">Transporte</span><span class="num b">${plata(o.transporte)}</span></div>`:''}
      <div style="height:1px;background:var(--line)"></div>
      <div class="between"><span class="b" style="font-size:17px">Total</span><span class="num b" style="font-size:26px">${plata(tt.total)}</span></div>
      <span class="small muted b">Seña del ${repo.db.config.sena} % para empezar: ${plata(tt.total*repo.db.config.sena/100)}</span>
      ${lineaTransporte(o)}
      ${o.medioPago !== 'Tarjeta' && o.comp !== 'Factura' ? `<span class="small b" style="color:var(--ink-2)">Precio en efectivo o transferencia, sin IVA. Con tarjeta: ${plata(totalCon(o,'Tarjeta'))} (IVA + ${String(repo.db.config.recargoTarjeta).replace('.',',')} % de recargo).</span>` : ''}
    </div>
    ${aprobado ? `<div class="note" style="background:var(--good-soft);color:var(--good-ink)">Aprobado el ${fecha(o.pres.aprobado)}. Los repuestos se descontaron del stock.</div>` :
      `<div class="note">Al aprobarlo se descuentan del stock los repuestos. Los servicios no se descuentan.</div>
       <div class="grid2"><a class="btn btn-wa" href="${waLink(c.tel, textoPresupuesto(o))}" target="_blank" rel="noopener" data-a="marcarEnviado" data-id="${o.id}">Enviar por WhatsApp</a>
       <button class="btn btn-main" data-a="aprobar" data-id="${o.id}" ${o.pres.items.length && o.pres.items.every(x => x.precio > 0)?'':'disabled'}>Marcar aprobado</button></div>`}
    ${condicionesCard()}
    <button class="btn btn-line" data-a="doc" data-v="presupuesto" data-id="${o.id}">Ver presupuesto</button>`;
}
function cobroTab(o, c){

      ${tt.iva?`<div class="between small"><span class="muted b">IVA ${repo.db.config.iva} %</span><span class="num b">${plata(tt.iva)}</span></div>`:''}
      ${tt.garExt?`<div class="between small"><span class="muted b">Garantía extendida</span><span class="num b">${plata(tt.garExt)}</span></div>`:''}
      ${tt.deposito?`<div class="between small"><span class="muted b">Depósito (${diasDesde(o.listo)} días listo)</span><span class="num b">${plata(tt.deposito)}</span></div>`:''}
      ${tt.recargo?`<div class="between small"><span class="muted b">Recargo tarjeta</span><span class="num b">${plata(tt.recargo)}</span></div>`:''}
      <div class="between"><span class="muted b">Total</span><span class="num b">${plata(tt.total)}</span></div>
      ${o.cobros.map(k => `<div class="between"><span class="muted b small">${esc(k.concepto)} · ${esc(k.medio)} · ${fecha(k.fecha)}</span><span class="num b">− ${plata(k.monto)}</span></div>`).join('')}
      <div style="height:1px;background:var(--line)"></div>

    </div>

      <label class="f"><span>Concepto</span><select class="in" id="cb-concepto"><option>${o.cobros.length?'Saldo':'Seña'}</option><option>Pago total</option><option>Transporte</option><option>Otro</option></select></label>
      <button type="submit" class="btn btn-main btn-big">Cobrar</button></form>` : `<div class="note" style="background:var(--good-soft);color:var(--good-ink)">Orden pagada completa.</div>`}
    <div class="grid2"><button class="btn btn-soft" data-a="doc" data-v="recibo" data-id="${o.id}">Ver recibo</button>
      <a class="btn btn-wa" href="${waLink(c.tel, textoRecibo(o))}" target="_blank" rel="noopener" data-a="reciboEnviado" data-id="${o.id}">Enviar por WhatsApp</a></div>
    ${(() => { const sg = segInfo(o), dd = repo.db.config.diasSeguimiento; return sg ? `<span class="small muted b">Seguimiento a los ${dd} días: ${sg.estado === 'Programado' ? (sg.vence ? 'ya toca mandarlo (está en Avisos)' : 'sale en ' + (dd - sg.dias) + ' días') : sg.estado === 'Cancelado' ? 'cancelado, ' + esc(sg.motivo || '') : sg.estado === 'Enviado' ? 'enviado, esperando respuesta' : sg.estado === 'Bien' ? 'respondió bien y se le pidió la reseña' : 'tuvo un problema'}</span>` : `<span class="small muted b">Al mandar el recibo arranca la cuenta de ${dd} días para preguntarle cómo anda el equipo.</span>`; })()}`;

/* ===== textos para WhatsApp ===== */
function lineas(o){ return o.pres.items.map(x => { const it = itemDe(x)||{}; return `• ${it.nombre} x${x.cant}: ${plata(x.precio*x.cant)}`; }).join('\n'); }
function textoIngreso(o){ const e = repo.equipo(o.equipoId)||{}; return `Clínica del Gym · Orden de ingreso #${o.num}\nEquipo: ${[e.tipo,e.marca,e.modelo].filter(Boolean).join(' ')}\nFalla: ${o.falla}\nEstado al ingresar: ${o.estadoIngreso||'—'}\nEste mensaje es tu comprobante para retirar el equipo.${condicionesTexto()}`; }
function textoPresupuesto(o){ const tt = totales(o), dm = demoraOrden(o); return `Clínica del Gym · Presupuesto orden #${o.num}\n${lineas(o)}\nSubtotal: ${plata(tt.sub)}${tt.iva?`\nIVA ${repo.db.config.iva}%: ${plata(tt.iva)}`:''}${o.transporte?`\nTransporte: ${plata(o.transporte)}`:''}${tt.recargo?`\nRecargo tarjeta: ${plata(tt.recargo)}`:''}\nTOTAL: ${plata(tt.total)}${o.medioPago!=='Tarjeta'&&o.comp!=='Factura'?` (efectivo o transferencia)\nCon tarjeta: ${plata(totalCon(o,'Tarjeta'))}`:''}${dm.dias?`\n\nAviso: ${dm.faltan.map(f=>f.it.nombre).join(', ')} no está en stock. Demora estimada ± ${dm.dias} días.`:''}${o.transporte ? (transPago(o) ? '\nTransporte: pagado.' : `\nFalta pagar transporte: ${plata(o.transporte)}.`) : ''}\n\nPara iniciar se abona el ${repo.db.config.sena}%. Para aprobarlo respondé APRUEBO.${condicionesTexto()}`; }
function textoRecibo(o){ const tt = totales(o); return `Clínica del Gym · Recibo orden #${o.num}\n${lineas(o)}\nTotal: ${plata(tt.total)}\nPagado: ${plata(tt.cobrado)}\nSaldo: ${plata(tt.falta)}${o.garExt?`\nIncluye garantía extendida a ${o.garExt.meses} meses.`:''}${o.transporte ? (transPago(o) ? '\nTransporte: pagado.' : `\nFalta pagar transporte: ${plata(o.transporte)}.`) : ''}\nDocumento no válido como factura.`; }

      </div>
      <div style="height:3px;background:#111111"></div>
      <div class="box" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">

        <div><div class="lbl">Teléfono</div>${esc(c.tel)}</div><div><div class="lbl">Equipo</div>${esc([e.tipo,e.marca,e.modelo].filter(Boolean).join(' '))}</div>

function invStock(){
  const q = norm(S.q.inv || ''), f = S.filtro.inv || 'Todos';
  let lista = repo.db.items.slice().sort((a,b) => a.nombre.localeCompare(b.nombre));
  if(f === 'Repuestos') lista = lista.filter(i => i.tipo === 'repuesto'); else if(f === 'Servicios') lista = lista.filter(i => i.tipo === 'servicio'); else if(f === 'Stock bajo') lista = lista.filter(i => conStock(i) && i.stock <= i.min);
  if(q) lista = lista.filter(i => norm(i.nombre).includes(q) || norm(i.codigo).includes(q));
  const bajos = repo.db.items.filter(i => conStock(i) && i.stock <= i.min).length;
  return `<div class="row"><label class="search" style="flex:1">${ic('search',20,2)}<input id="q-inv" type="search" placeholder="Nombre o código" value="${esc(S.q.inv||'')}" data-in="q" data-k="inv" autocomplete="off"></label>
      <label class="btn btn-dark" style="width:52px;min-height:52px;padding:0" aria-label="Escanear código de barras o QR con una foto">${ic('barcode',24,2)}<input type="file" accept="image/*" capture="environment" id="scan-inv" data-in="scan" hidden></label></div>
    <div class="chips">${['Todos','Repuestos','Servicios','Stock bajo'].map(x => `<button class="chip ${x===f?'on':''}" data-a="filtro" data-k="inv" data-v="${x}">${x}</button>`).join('')}</div>
    ${bajos && f!=='Stock bajo' ? `<button class="card" data-a="tab" data-k="inv" data-v="Proveedores" style="flex-direction:row;align-items:center;border:0;background:var(--warn-soft);text-align:left"><span class="avatar" style="background:var(--accent);color:var(--accent-ink)">${bajos}</span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="b">Repuestos con stock bajo</span><span class="small b" style="color:var(--warn-ink)">Tocá para armar el pedido a cada proveedor</span></span></button>` : ''}
    ${lista.length ? lista.map(i => `<button class="card" data-a="editarItem" data-id="${i.id}" style="flex-direction:row;align-items:center;border:0;text-align:left;gap:12px">
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span class="b" style="font-size:16px">${esc(i.nombre)}</span><span class="small muted">${esc(i.codigo)}${i.prov && repo.prov(i.prov)?' · '+esc(repo.prov(i.prov).nombre):''}</span><span class="b num">${plata(i.precio)}</span></span>${stockBox(i)}</button>`).join('') : `<div class="empty">No hay ítems con ese nombre o código.</div>`}`;
}
function invPiden(){
  const lista = repo.db.piden.slice().sort((a,b) => b.veces - a.veces);
  const top = lista[0];
  return `<p class="muted b" style="margin:0;line-height:1.45">Lo que los clientes preguntan y no tenemos. Anotalo cada vez para ver las ventas que se pierden.</p>
    <form class="row" id="f-piden"><input class="in" id="pd-nombre" placeholder="Ej.: colchoneta 1,80 × 0,60" style="flex:1;min-width:0"><button class="btn btn-dark" type="submit">Anotar</button></form>
    ${top && top.veces >= 3 ? `<div class="note">${esc(top.nombre)} se pidió ${top.veces} veces: conviene traerlo.</div>` : ''}
    ${lista.length ? lista.map(p => `<div class="card"><div class="between"><span style="display:flex;flex-direction:column;gap:2px"><span class="b">${esc(p.nombre)}</span><span class="small muted">Último pedido: ${fecha(p.ultimo)}</span></span><span style="text-align:center"><span class="num b" style="font-size:24px;color:${p.veces>=3?'var(--warn-ink)':'var(--ink)'}">${p.veces}</span><br><span class="tiny b muted">veces</span></span></div>
      <div class="grid2"><button class="btn btn-soft btn-sm" data-a="pidenMas" data-id="${p.id}">+1 otra vez</button><button class="btn btn-line btn-sm" data-a="pidenBorrar" data-id="${p.id}">Ya lo traemos</button></div></div>`).join('') : `<div class="empty">Todavía no anotaste pedidos de clientes.</div>`}`;
}
function faltantesDe(pid){
  const deStock = repo.db.items.filter(i => i.tipo==='repuesto' && i.prov===pid && i.stock <= i.min).map(i => ({it:i, cant:Math.max(1, i.min*2 - i.stock)}));
  return deStock;
}
function invProv(){
  return repo.db.proveedores.map(p => { const f = faltantesDe(p.id);
    const msg = `Hola, ¿cómo estás? Te escribo de Clínica del Gym. Necesito:\n${f.map(x => `• ${x.cant} × ${x.it.nombre}`).join('\n')}\n¿Para cuándo lo podrías tener? Gracias.`;
    return `<div class="card"><div class="between"><span style="display:flex;flex-direction:column;gap:2px"><span class="b" style="font-size:16px">${esc(p.nombre)}</span><span class="small muted">Entrega en ± ${p.demora} días${p.tel?' · '+esc(p.tel):''}</span></span>
      <span class="pill ${f.length?'p-warn':'p-gray'}">${f.length?f.length+' faltantes':'Todo OK'}</span></div>
      ${f.length ? `<div style="background:var(--good-soft);border-radius:14px 14px 14px 4px;padding:12px;white-space:pre-line;font-weight:600;line-height:1.5">${esc(msg)}</div>
        <div class="grid2">${p.tel?`<a class="btn btn-wa" href="${waLink(p.tel,msg)}" target="_blank" rel="noopener">Enviar pedido</a>`:`<button class="btn btn-soft" data-a="editarProv" data-id="${p.id}">Cargar su teléfono</button>`}<button class="btn btn-line" data-a="copiar" data-v="${esc(msg)}">Copiar</button></div>` : ''}
      <button class="btn btn-line btn-sm" data-a="editarProv" data-id="${p.id}">Editar proveedor</button></div>`; }).join('') +
    `<button class="btn btn-line btn-big" style="border-style:dashed" data-a="nuevoProv">+ Agregar proveedor</button>`;
}

const NEGOCIOS = ['Clínica del Gym','Venta de repuestos','Alquiler de viviendas','Alquiler de máquinas','Sistemas mensuales'];
const CATEGORIAS = ['Combustible','Repuestos','Sueldos y adelantos','Alquiler','Servicios (luz, agua, internet)','Publicidad','Herramientas','Impuestos','Otro'];
const CAT_ING = ['Alquiler cobrado','Abono mensual','Venta','Trabajos del taller','Otro'];
/* Entiende frases como "cargué 30 mil de nafta, 40 litros, la camioneta marca 12.300 km, en efectivo" */
function parseGastoVoz(t){
  const base = String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let s = ' ' + base.replace(/(\d)[.,](\d{3})(?!\d)/g, '$1$2').replace(/(\d)[.,](\d{3})(?!\d)/g, '$1$2').replace(/\$\s*/g, '$') + ' ';
  const W = {un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10, quince:15, veinte:20, treinta:30, cuarenta:40, cincuenta:50, sesenta:60, setenta:70, ochenta:80, noventa:90, cien:100, ciento:100, doscientos:200, trescientos:300, cuatrocientos:400, quinientos:500};
  s = s.replace(/\b(un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince|veinte|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento|doscientos|trescientos|cuatrocientos|quinientos)\b(?=\s+(mil|millon|millones|litros|lts|pesos|kilometros|km)\b)/g, w => W[w]);
  const out = {texto:String(t || '').trim()};
  const n = x => parseFloat(String(x).replace(',', '.'));
  const mult = w => w === 'mil' || w === 'k' ? 1000 : /^millon/.test(w || '') ? 1e6 : 1;
  const usados = [];
  let m = s.match(/(\d+(?:[.,]\d+)?)\s*(litros|litro|lts|lt)\b/);
  if(m){ out.litros = n(m[1]); usados.push(m.index); }
  m = s.match(/(?:marca|kilometraje|odometro|tiene)\s+(\d+(?:[.,]\d+)?)\s*(mil)?/) || s.match(/(\d+(?:[.,]\d+)?)\s*(mil)?\s*(kilometros|kilometro|km|kms)\b/);
  if(m){ out.km = Math.round(n(m[1]) * (m[2] ? 1000 : 1)); usados.push(s.indexOf(m[1], m.index)); }
  const cands = []; const re = /(\$)?(\d+(?:[.,]\d+)?)\s*(mil|millones|millon|k)?\s*(pesos|mangos)?/g; let x;
  while((x = re.exec(s))){ const idx = x.index + (x[1] ? 1 : 0); if(usados.includes(idx) || usados.includes(x.index)) continue;
    const after = s.slice(re.lastIndex, re.lastIndex + 12); if(/^\s*(litros|litro|lts|lt|km|kilometro|kms)/.test(after)) continue;
    const v = n(x[2]) * mult(x[3]); cands.push({v, fuerte:!!(x[1] || x[3] || x[4])}); }
  const f = cands.filter(c => c.fuerte); const elegido = (f.length ? f : cands).sort((a, b) => b.v - a.v)[0];
  if(elegido) out.monto = Math.round(elegido.v);
  const CAT = [['Combustible', /nafta|gasoil|gas oil|combustible|diesel|carga de|cargue|surtidor|ypf|shell|axion/], ['Sueldos y adelantos', /sueldo|adelanto|quincena|jornal/],
    ['Repuestos', /repuesto|lona|correa|rulem|rodamiento|placa|motor/], ['Alquiler', /alquiler/], ['Servicios (luz, agua, internet)', /\bluz\b|\bagua\b|internet|telefono|celular|edesa|aguas del norte/],
    ['Publicidad', /publicidad|anuncio|instagram|facebook|promocion/], ['Herramientas', /herramienta|mecha|taladro|llave|amoladora|destornillador/], ['Impuestos', /impuesto|monotributo|iibb|ingresos brutos|afip|arca|rentas|percepcion/]];
  const c = CAT.find(([, r]) => r.test(s)); if(c) out.categoria = c[0];
  const MED = [['Efectivo', /efectivo|cash/], ['Transferencia', /transferencia|transferi/], ['Mercado Pago', /mercado ?pago/], ['Tarjeta', /tarjeta|debito|credito/]];
  const md = MED.find(([, r]) => r.test(s)); if(md) out.medio = md[0];
  if(/\b(cobre|me pagaron|ingreso|entro plata|nos pagaron)\b/.test(s)) out.tipo = 'ingreso';
  return out;
}

function dictarGasto(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Este navegador no deja dictar. Usá el micrófono del teclado en el campo Detalle.'); return; }
  const rec = new SR(); rec.lang = 'es-AR'; rec.interimResults = false; rec.maxAlternatives = 1;
  S.p.escuchando = true; render();
  rec.onresult = ev => { const t = ev.results[0][0].transcript, r = parseGastoVoz(t), d = S.p.d;
    if(r.tipo === 'ingreso' && d.tipo !== 'ingreso'){ d.tipo = 'ingreso'; d.categoria = 'Otro'; }
    if(r.monto) d.monto = String(r.monto); if(r.categoria && d.tipo !== 'ingreso') d.categoria = r.categoria; if(r.medio) d.medio = r.medio;
    if(r.litros) d.litros = String(r.litros).replace('.', ','); if(r.km) d.km = String(r.km); d.detalle = r.texto; S.p.oido = r;
    toast(r.monto ? 'Entendí ' + plata(r.monto) + (r.categoria ? ' de ' + r.categoria.toLowerCase() : '') + '. Revisá y guardá.' : 'No entendí el monto: escribilo'); };
  rec.onerror = ev => { toast(ev.error === 'not-allowed' ? 'Dale permiso al micrófono para dictar' : ev.error === 'no-speech' ? 'No te escuché, probá de nuevo' : 'No se pudo dictar: ' + ev.error); };
  rec.onend = () => { S.p.escuchando = false; render(); };
  try{ rec.start(); }catch(e){ S.p.escuchando = false; render(); }
}

function interesDe(o){

function agruparTop(lista, max){
  const orden = lista.filter(x => x.valor > 0).sort((a, b) => b.valor - a.valor);
  if(orden.length <= max) return orden;
  const resto = orden.slice(max - 1);

function dona(items, colores, centro, sub, titulo){
  const total = items.filter(x => !x.off).reduce((s, x) => s + x.valor, 0);
  const S2 = 200, c = 100, R = 92, r = 58; let a = -Math.PI / 2;

  const partes = !total ? `<circle cx="${c}" cy="${c}" r="${(R + r) / 2}" fill="none" style="stroke:var(--line)" stroke-width="${R - r}"/>` : items.map((it, i) => {
    if(it.off) return '';
    const ang = it.valor / total * Math.PI * 2, col = colores[it.otros ? colores.length - 1 : Math.min(i, colores.length - 2)];
    const tip = `${it.nombre}: ${plata(it.valor)} (${Math.round(it.valor / total * 100)} %)`;
    if(ang >= Math.PI * 2 - 1e-6){ a += ang; return `<circle cx="${c}" cy="${c}" r="${(R + r) / 2}" fill="none" stroke="${col}" stroke-width="${R - r}"><title>${esc(tip)}</title></circle>`; }
    const [x1, y1] = pt(R, a), [x2, y2] = pt(R, a + ang), [x3, y3] = pt(r, a + ang), [x4, y4] = pt(r, a), big = ang > Math.PI ? 1 : 0; a += ang;
    return `<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z" fill="${col}" style="stroke:var(--surface)" stroke-width="2"><title>${esc(tip)}</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 ${S2} ${S2}" width="190" height="190" style="max-width:100%;flex-shrink:0" role="img" aria-label="${esc(titulo + ': ' + items.filter(x => !x.off).map(x => x.nombre + ' ' + Math.round(x.valor / (total || 1) * 100) + ' %').join(', '))}">${partes}
    <text x="${c}" y="${c - 2}" text-anchor="middle" font-size="19" font-weight="800" style="fill:var(--ink)">${esc(centro)}</text>
    <text x="${c}" y="${c + 17}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--muted)">${esc(sub)}</text></svg>`;
}

function repuestosMes(off){

/* ===== quincenas y horas ===== */
function quincena(off){
  const d = new Date(); let y = d.getFullYear(), m = d.getMonth(), mitad = d.getDate() <= 15 ? 0 : 1;
  let k = m * 2 + mitad + off; y += Math.floor(k / 24); k = ((k % 24) + 24) % 24; m = Math.floor(k / 2); mitad = k % 2;
  const desde = new Date(y, m, mitad ? 16 : 1), hasta = mitad ? new Date(y, m + 1, 1) : new Date(y, m, 16);
  const nombre = (mitad ? '2.ª' : '1.ª') + ' quincena de ' + desde.toLocaleDateString('es-AR', {month:'long'});
  return {desde, hasta, nombre, clave:y + '-' + m + '-' + mitad};
}

  const pagado = repo.db.pagosQuincena.find(p => p.uid === uidE && p.q === q.clave);

}

const REF_PRECIO = {'Cinta de correr':900000, 'Bicicleta fija':400000, 'Elíptico':650000, 'Multigym':800000, 'Máquina de placas':700000, 'Otro':400000};
const MARCAS_BUENAS = ['athletic', 'randers', 'olmo', 'life fitness', 'precor', 'technogym', 'matrix', 'bh', 'star trac', 'movement', 'gold'];
function velocidadVenta(m){
  const edad = new Date().getFullYear() - (+m.anio || new Date().getFullYear() - 8), r = (m.precioVenta || 0) / (REF_PRECIO[m.tipo] || 500000);
  let p = 0; if(r >= 0.3 && r <= 0.75) p += 2; else if(r > 0.9) p -= 2; else if(r < 0.2) p -= 1; else p += 0;
  if(edad <= 6) p += 1; else if(edad >= 12) p -= 2; else if(edad >= 9) p -= 1;
  if(MARCAS_BUENAS.includes(norm(m.marca))) p += 1;

  const base = p >= 3 ? ['Rápida', 'p-good', 14] : p >= 1 ? ['Media', 'p-note', 30] : ['Lenta', 'p-bad', 60];
  const dias = prom ? Math.round((base[2] + prom) / 2) : base[2];

function cargarScript(src){ return new Promise((ok, mal) => { if(document.querySelector(`script[src="${src}"]`)){ const t = setInterval(() => { if(document.querySelector(`script[src="${src}"]`).dataset.ok){ clearInterval(t); ok(); } }, 100); return; } const s = document.createElement('script'); s.src = src; s.onload = () => { s.dataset.ok = '1'; ok(); }; s.onerror = mal; document.head.appendChild(s); }); }
const LIB_QR = 'vendor/qrcode.js';
const LIB_H2C = 'vendor/html2canvas.min.js';
const LIB_PDF = 'vendor/jspdf.umd.min.js';
async function pintarQR(){
  const els = document.querySelectorAll('[data-qr]'); if(!els.length) return;
  try{ if(!window.qrcode) await cargarScript(LIB_QR); }catch(e){}
  els.forEach(el => { if(!window.qrcode){ el.innerHTML = `<div style="width:100%;height:100%;border:2px dashed #888;display:flex;align-items:center;justify-content:center;font-size:9px;text-align:center">QR</div>`; return; }
    const q = window.qrcode(0, 'M'); q.addData(el.dataset.qr); q.make(); el.innerHTML = q.createSvgTag({cellSize:3, margin:0, scalable:true}); const s = el.querySelector('svg'); if(s){ s.style.width = '100%'; s.style.height = '100%'; } });
}
function hojasA4(){
  document.querySelectorAll('.doc').forEach(d => { if(d.parentElement.classList.contains('hoja-wrap')) return; const w = document.createElement('div'); w.className = 'hoja-wrap'; d.parentNode.insertBefore(w, d); w.appendChild(d);
    const av = document.createElement('div'); av.className = 'hoja-aviso'; av.hidden = true; av.textContent = 'Este documento es más largo que una hoja: en el PDF se achica un poco para que entre en una sola A4.'; w.after(av); });
  document.querySelectorAll('.doc img').forEach(im => { if(!im.complete) im.addEventListener('load', ajustarHojas, {once:true}); });
  ajustarHojas(); setTimeout(ajustarHojas, 400);
}
function ajustarHojas(){ document.querySelectorAll('.hoja-wrap').forEach(w => { const d = w.firstElementChild, k = Math.min(1, w.clientWidth / 794); d.style.transform = `scale(${k})`; w.style.height = Math.ceil(d.offsetHeight * k) + 'px'; const av = w.nextElementSibling; if(av && av.classList.contains('hoja-aviso')) av.hidden = d.offsetHeight <= 1124; }); }
window.addEventListener('resize', () => ajustarHojas());
async function descargarPDF(nombre, compartir){
  const el = $('#doc-pdf') || $('.doc'); if(!el) return;
  toast('Armando el PDF…');
  try{ await cargarScript(LIB_H2C); await cargarScript(LIB_PDF); }catch(e){ toast('No se pudo cargar el generador de PDF. Probá con señal.'); return; }
  // copia sin achicar, al ancho exacto de una A4, fuera de la pantalla
  const hold = document.createElement('div'); hold.className = 'hoja-pdf'; hold.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#FFFFFF';
  const cl = el.cloneNode(true); cl.style.transform = 'none'; hold.appendChild(cl); document.body.appendChild(hold);
  let cv; try{ cv = await window.html2canvas(cl, {scale:2, backgroundColor:'#FFFFFF', width:794, windowWidth:794}); } finally { hold.remove(); }
  // siempre una sola hoja A4: si es más largo, se achica proporcionalmente y se centra
  const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4'}); let W = 210, H = cv.height * 210 / cv.width;
  if(H > 297){ W = W * 297 / H; H = 297; }
  pdf.addImage(cv.toDataURL('image/jpeg', .92), 'JPEG', (210 - W) / 2, 0, W, H);
  const blob = pdf.output('blob');
  if(compartir){ try{ const file = new File([blob], nombre, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:nombre, text:compartir}); toast('Elegí WhatsApp y el contacto'); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
    toast('Este visor no deja compartir directo: se descarga el PDF'); }
  let dl = null; try{ dl = window.claude && await window.claude.use('downloads'); }catch(e){}
  if(dl){ try{ await dl.save({filename:nombre, data:blob}); toast('PDF guardado'); }catch(err){ if(err && err.code !== 'declined') toast('No se pudo guardar el PDF acá'); } return; }
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ toast('Descargá el PDF desde la app instalada'); }
}

  'Volante':['volante'], 'Freno o pastilla':['freno', 'pastilla'], 'Correa o cadena':['correa', 'cadena'], 'Pedales y bielas':['pedal', 'biela'], 'Rulemanes':['rulem', 'rodamiento'], 'Asiento y regulaciones':['asiento', 'regule', 'perilla'],
  'Manubrio':['manubrio'], 'Ruedas y rieles':['rueda', 'riel'], 'Correa':['correa'], 'Magnetos y resistencia':['magnet', 'iman'], 'Consola':['consola'], 'Sensor':['sensor'], 'Pedales y brazos':['pedal', 'brazo', 'bulon'],
  'Cables de acero':['cable'], 'Poleas':['polea'], 'Tapizado':['tapiz'], 'Pernos y bulones':['bulon', 'perno', 'tornillo'], 'Guías':['guia', 'buje'], 'Pesas y selector':['pesa', 'selector'], 'Estructura y soldaduras':['soldadura'],
  'Limpieza y lubricación':['lubric']};
const tipoCheck = e => CHECK[e && e.tipo] ? e.tipo : (e && e.tipo === 'Máquina de placas' ? 'Multigym' : 'Otro');
function puntosDe(e){ const t = tipoCheck(e); return CHECK[t].filter(p => !(p === 'Motor de inclinación' && e && e.inclinacion === false)); }
const necesitaCheck = o => !o.importado && o.pres.estado === 'Borrador' && !(o.check && o.check.completo);
function itemPara(p, e){
  const m = modeloDeEquipo(e); if(m){ const pz = m.piezas.find(z => z.itemId && (KW[p] || [norm(p)]).some(k => norm(z.pieza).includes(k))); if(pz && repo.item(pz.itemId)) return repo.item(pz.itemId); }
  const terms = KW[p] || [norm(p)], toks = norm([e && e.marca, e && e.modelo].join(' ')).split(' ').filter(t => t.length >= 3 || /\d/.test(t));
  let best = null, bs = -1;
  repo.db.items.forEach(i => { const txt = norm(i.nombre + ' ' + (i.detalle || '')); if(!terms.some(k => txt.includes(k))) return;
    let sc = 0; toks.forEach(t => { if(txt.includes(t)) sc += /\d/.test(t) ? 3 : 1; }); if(i.tipo === 'repuesto') sc += .5; if(sc > bs){ bs = sc; best = i; } });

}

function migrarHilux(db){
  db.cargas = db.cargas || []; db.herramientas = db.herramientas || [];
  db.vehiculo = db.vehiculo || {nombre:'Toyota Hilux', cadaKm:10000, ultimoServiceKm:null, services:[], venc:[{id:'v1', nombre:'VTV', fecha:''}, {id:'v2', nombre:'Seguro', fecha:''}, {id:'v3', nombre:'Patente', fecha:''}]};
  const ci = db.config; ci.interesModo = ci.interesModo || 'mensual'; ci.interesSemanal = ci.interesSemanal ?? 3; ci.diasGracia = ci.diasGracia ?? 10; if(!db.interes7){ db.interes7 = true; if(ci.interes === 5 || ci.interes == null) ci.interes = 7; }
  db.config.alertaConsumo = db.config.alertaConsumo ?? 10; db.config.diasHerramienta = db.config.diasHerramienta ?? 3;
  if(db.ejemplosHilux) return; db.ejemplosHilux = true;
  let km = 41200; for(let i = 0; i < 18; i++){ const kml = i < 11 ? 8.6 + ((i * 7) % 5 - 2) * 0.15 : 7.5 + ((i * 3) % 4 - 1.5) * 0.15, lit = [30, 45, 25, 40, 35][i % 5];
    db.cargas.push({id:uid(), fecha:isoHace((18 - i) * 4), km, litros:lit, monto:lit * 1950, lleno:false, usuario:i % 2 ? 'Papá' : 'Aarón', ejemplo:true}); km += Math.round(lit * kml); }
  if(db.vehiculo.ultimoServiceKm == null){ db.vehiculo.ultimoServiceKm = km - 9300; db.vehiculo.serviceEjemplo = true; }
  if(!db.herramientas.length) ['Pinza amperimétrica', 'Tester', 'Taladro', 'Extractor de rulemanes', 'Juego de llaves Allen'].forEach((n, i) => db.herramientas.push({id:'h' + i, nombre:n, con:null, desde:null, hist:[]}));
  const t = db.herramientas.find(h => h.nombre === 'Extractor de rulemanes'); if(t && !t.con){ t.con = 'u2'; t.desde = isoHace(5); }
}
const cargasOrd = () => repo.db.cargas.slice().sort((a, b) => a.km - b.km);
const ultimaCargaReal = () => repo.db.cargas.filter(c => !c.ejemplo).sort((a, b) => b.km - a.km)[0];
function rend(cs){ if(cs.length < 2) return null; const kmT = cs[cs.length - 1].km - cs[0].km, lt = cs.slice(0, -1).reduce((s, c) => s + c.litros, 0); return lt > 0 && kmT > 0 ? kmT / lt : null; }
function consumo(){
  const cs = cargasOrd(), n = cs.length, cf = repo.db.config, r = {n, prom:rend(cs)};
  const ult = cs.slice(-16); if(ult.length >= 2){ const kmT = ult[ult.length - 1].km - ult[0].km, plata2 = ult.slice(0, -1).reduce((s, c) => s + (c.monto || 0), 0); r.costoKm = kmT > 0 ? plata2 / kmT : null; }
  if(n < 15){ r.falta = 15 - n; return r; }
  const rec = cs.slice(n - 8), base = cs.slice(0, n - 7); r.base = rend(base); r.rec = rend(rec);
  const tramos = rec.slice(0, -1).map((c, i) => (rec[i + 1].km - c.km) / c.litros), bajos = tramos.filter(t => t < r.base * (1 - cf.alertaConsumo / 200)).length;
  r.pct = r.base && r.rec ? (r.base / r.rec - 1) * 100 : 0; r.desde = rec[0].fecha;
  r.sistematico = r.pct >= cf.alertaConsumo && bajos >= 5;
  r.puntual = !r.sistematico && tramos.some(t => t < r.base * 0.85);
  return r;
}

/* ================= fotos y escaneo ================= */
function comprimir(file){
  return new Promise((ok) => { const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => {
    const m = 900, k = Math.min(1, m / Math.max(img.width, img.height)); const cv = document.createElement('canvas'); cv.width = img.width*k; cv.height = img.height*k;
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); ok(cv.toDataURL('image/jpeg', .72)); }; img.onerror = () => ok(null); img.src = r.result; }; r.readAsDataURL(file); });
}
async function leerCodigo(file){
  if(!('BarcodeDetector' in window)){ toast('Este celular no lee códigos desde foto. Escribilo a mano.'); return null; }
  try{ const bmp = await createImageBitmap(file); const det = new BarcodeDetector(); const res = await det.detect(bmp); if(res[0]) return res[0].rawValue; toast('No se encontró un código en la foto'); }catch(e){ toast('No se pudo leer el código'); }
  return null;
}

function aprobar(o){
  if(o.pres.estado === 'Aprobado') return;
  if(!o.fechaEst) o.fechaEst = diaStr(repo.db.config.demoraDefecto + demoraOrden(o).dias);
  o.pres.items.forEach(x => { const it = itemDe(x); if(it && it.tipo === 'repuesto'){ if(it.ctrl === false){ x.reservado = true; return; } x.reservado = it.stock >= x.cant; it.stock = it.stock - x.cant; } });
  o.pres.estado = 'Aprobado'; o.pres.aprobado = hoy(); repo.guardar();
}

function canon(v){
  if(Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return v === undefined ? 'null' : JSON.stringify(v);
}
function hashTxt(s){ let h = 0x811c9dc5; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + '.' + s.length.toString(36); }
const hashDoc = d => hashTxt(canon(d));

function crearNube(){
  const sb = window.supabase.createClient(NUBE_URL, NUBE_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:'cdg-sesion'}});
  return {
    async sesion(){ const {data} = await sb.auth.getSession(); return data.session; },
    async entrar(email, pass){ const {data, error} = await sb.auth.signInWithPassword({email, password:pass}); if(error) throw error; return data.session; },
    async salir(){ await sb.auth.signOut(); },
    async perfil(id){ const {data, error} = await sb.from('perfiles').select('id,usuario,nombre,rol').eq('id', id).maybeSingle(); if(error) throw error; return data; },
    async perfiles(){ const {data, error} = await sb.from('perfiles').select('id,usuario,nombre,rol'); if(error) throw error; return data || []; },
    async traer(desde, inicial){
      const out = [];
      for(let i = 0; ; i += 1000){
        let q = sb.from('docs').select('col,id,data,borrado,actualizado').order('actualizado').order('col').order('id').range(i, i + 999);
        if(desde) q = q.gt('actualizado', desde); if(inicial) q = q.eq('borrado', false);
        const {data, error} = await q; if(error) throw error; out.push(...data); if(data.length < 1000) break;
      }
      return out;
    },
    async subir(rows){ const {error} = await sb.from('docs').upsert(rows, {onConflict:'col,id'}); if(error) throw error; },
    escuchar(cb){ return sb.channel('docs-cambios').on('postgres_changes', {event:'*', schema:'public', table:'docs'}, p => { if(p.new && p.new.col) cb(p.new); }).subscribe(); },
    async historial(n){ const {data, error} = await sb.from('historial').select('col,doc_id,accion,por,cuando,antes,despues').order('cuando', {ascending:false}).limit(n || 200); if(error) throw error; return data || []; }
  };
}

const sync = {uid:null, perfil:null, snap:{}, outbox:{}, last:null, listo:false, ver:0, subiendo:false, timer:null, escuchando:false};

function guardarCache(){
  try{ localStorage.setItem(CACHE, JSON.stringify({uid:sync.uid, perfil:sync.perfil, db:repo.db, snap:sync.snap, outbox:sync.outbox, last:sync.last})); }
  catch(e){ toast('El celular se quedó sin espacio para guardar los datos sin señal'); }
}
function leerCache(id){ try{ const c = JSON.parse(localStorage.getItem(CACHE) || 'null'); return c && c.uid === id ? c : null; }catch(e){ return null; } }

function dbVacia(){
  const d = semilla(); COLS.forEach(c => d[c] = []); d.sigNum = 1;
  FLAGS.forEach(k => d[k] = true); d.config.interes = 7;
  return d;
}
function docsActuales(){
  const m = {}, db = repo.db;
  COLS.forEach(c => (db[c] || []).forEach(d => { if(!d.id) d.id = uid(); m[c + '|' + d.id] = {col:c, id:d.id, data:d}; }));
  Object.keys(db).forEach(k => { if(!COLS.includes(k)) m['meta|' + k] = {col:'meta', id:k, data:{v:db[k]}}; });
  return m;
}
/* Compara el estado actual con lo último sincronizado y anota lo que hay que subir */
function detectarCambios(){
  if(!sync.listo) return 0;
  const act = docsActuales(); let n = 0;
  for(const k in act){ const h = hashDoc(act[k].data); if(sync.snap[k] !== h){ sync.outbox[k] = {col:act[k].col, id:act[k].id, data:act[k].data, borrado:false, v:++sync.ver}; sync.snap[k] = h; n++; } }
  const borr = Object.keys(sync.snap).filter(k => !act[k]);
  if(borr.length > 60){ console.warn('Se frenaron ' + borr.length + ' borrados masivos por seguridad'); toast('Se evitó borrar ' + borr.length + ' registros por seguridad. Recargando desde la nube…'); sync.last = null; traerCambios().then(() => { guardarCache(); render(); }).catch(() => {}); return n; }
  borr.forEach(k => { const i = k.indexOf('|'); sync.outbox[k] = {col:k.slice(0, i), id:k.slice(i + 1), data:{}, borrado:true, v:++sync.ver}; delete sync.snap[k]; n++; });
  return n;
}
const esErrorRed = e => !navigator.onLine || (!(e && e.code) && /fetch|network|timeout|load failed|abort/i.test(String((e && (e.message || e)) || '')));
async function subirPendientes(){
  if(sync.subiendo || !nube || !sync.listo) return;
  const keys = Object.keys(sync.outbox); if(!keys.length || !navigator.onLine){ estadoSync(); return; }
  sync.subiendo = true; estadoSync();
  const fila = k => { const o = sync.outbox[k]; return {col:o.col, id:o.id, data:JSON.parse(JSON.stringify(o.data || {})), borrado:!!o.borrado}; };
  const listo = (k, v) => { if(sync.outbox[k] && sync.outbox[k].v === v) delete sync.outbox[k]; };
  try{
    for(let i = 0; i < keys.length; i += 200){
      const lote = keys.slice(i, i + 200).filter(k => sync.outbox[k]); if(!lote.length) continue;
      const vs = lote.map(k => sync.outbox[k].v), rows = lote.map(fila);
      try{ await nube.subir(rows); lote.forEach((k, j) => listo(k, vs[j])); }
      catch(e){
        if(esErrorRed(e)) throw e;
        for(const k of lote){ if(!sync.outbox[k]) continue; const v = sync.outbox[k].v;
          try{ await nube.subir([fila(k)]); listo(k, v); }
          catch(e2){ if(esErrorRed(e2)) throw e2; console.warn('La nube rechazó', k, e2); listo(k, v); sync.rechazados = (sync.rechazados || 0) + 1; } }
      }
    }
    sync.error = false;
  }catch(e){ sync.error = true; setTimeout(subirPendientes, 20000); }
  finally{ sync.subiendo = false; guardarCache(); estadoSync(); if(Object.keys(sync.outbox).length && !sync.error) setTimeout(subirPendientes, 500); }
}
/* Aplica un registro que vino de la nube. Devuelve true si cambió algo. */
function aplicarRemoto(r){
  const k = r.col + '|' + r.id; if(sync.outbox[k]) return false;
  const db = repo.db;
  if(r.borrado){
    if(!(k in sync.snap)) return false; delete sync.snap[k];
    if(r.col === 'meta') delete db[r.id]; else if(db[r.col]){ const i = db[r.col].findIndex(x => x.id === r.id); if(i >= 0) db[r.col].splice(i, 1); }
    return true;
  }
  const h = hashDoc(r.data); if(sync.snap[k] === h) return false; sync.snap[k] = h;
  if(r.col === 'meta') db[r.id] = r.data.v;
  else { const a = db[r.col] = db[r.col] || []; const i = a.findIndex(x => x.id === r.id); if(i >= 0) a[i] = r.data; else a.push(r.data); }
  return true;
}
/* Los cambios en vivo llegan de a uno: se juntan y se aplican en tandas (al importar pueden llegar miles) */
const colaRemota = []; let colaT = null;
function recibirRemoto(r){ colaRemota.push(r); if(!colaT) colaT = setTimeout(procesarCola, 400); }
function procesarCola(){
  colaT = null; const rows = colaRemota.splice(0); if(!sync.listo || !rows.length) return; let ch = false;
  rows.forEach(r => { if(aplicarRemoto(r)) ch = true; if(!sync.last || r.actualizado > sync.last) sync.last = r.actualizado; });
  if(ch){ prepararDb(); guardarCache(); renderSuave(); }
}
async function traerCambios(){
  if(!nube) return false;
  const desde = sync.last ? new Date(new Date(sync.last).getTime() - 120000).toISOString() : null;
  const rows = await nube.traer(desde, !sync.last); let cambio = false;
  rows.forEach(r => { if(aplicarRemoto(r)) cambio = true; if(!sync.last || r.actualizado > sync.last) sync.last = r.actualizado; });
  return cambio;
}
let renderPend = false;
function renderSuave(){
  const a = document.activeElement;
  if(a && a.closest && a.closest('#app') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ if(!renderPend){ renderPend = true; a.addEventListener('blur', () => { renderPend = false; setTimeout(render, 50); }, {once:true}); } return; }
  if(document.getElementById('firma-pad') && !$('#firma-pad').dataset.vacio) return;
  render();
}
function estadoSync(){
  const el = $('#sync-pill'); if(!el) return;
  const n = Object.keys(sync.outbox).length;
  if(!navigator.onLine){ el.hidden = false; el.className = 'sync-off'; el.textContent = n ? `Sin señal · ${n} cambio${n === 1 ? '' : 's'} guardado${n === 1 ? '' : 's'} en el celular` : 'Sin señal · trabajando con lo guardado'; return; }
  if(sync.subiendo || n){ el.hidden = false; el.className = 'sync-up'; el.textContent = sync.error ? `No se pudo subir · ${n} pendiente${n === 1 ? '' : 's'}, reintentando` : `Subiendo ${n} cambio${n === 1 ? '' : 's'}…`; return; }
  el.hidden = true;
}
function asegurarUsuario(p){
  const db = repo.db; db.usuarios = db.usuarios || [];
  let u = db.usuarios.find(x => x.id === p.usuario);
  if(!u){ u = {id:p.usuario, nombre:p.nombre, ini:iniciales(p.nombre), rol:p.rol, pin:'', valorHora:0, tel:''}; db.usuarios.push(u); }
  u.nombre = p.nombre; u.rol = p.rol; u.ini = iniciales(p.nombre); u.uid = p.id;
  return u;
}
function prepararDb(){ const db = repo.db; COLS.forEach(c => db[c] = db[c] || []); FLAGS.forEach(k => { if(db[k] === undefined) db[k] = true; }); db.config = db.config || semilla().config; db.gastos = db.gastos || []; db.modelos = db.modelos || []; migrarNumeros(db); }
function siguienteNum(){ const db = repo.db; db.sigNum = Math.max(db.sigNum || 1, ...db.ordenes.map(o => (o.num || 0) + 1)); return db.sigNum++; }

async function entrarConSesion(user){
  sync.uid = user.id; const c = leerCache(user.id);
  let perfil = null;
  try{ perfil = await nube.perfil(user.id); }catch(e){ perfil = c && c.perfil; }
  if(!perfil){ try{ await nube.salir(); }catch(e){} S.view = 'ingresar'; S.p = {error:'Tu usuario todavía no tiene permiso. Pedile a Aarón que te agregue.'}; render(); return; }
  sync.perfil = perfil;
  if(c){
    repo.db = c.db; sync.snap = c.snap || {}; sync.outbox = c.outbox || {}; sync.last = c.last; sync.listo = true;
    prepararDb(); empezarUI();
    traerCambios().then(ch => { if(ch){ prepararDb(); guardarCache(); renderSuave(); } if(detectarCambios()) guardarCache(); subirPendientes(); }).catch(() => estadoSync());
  } else {
    S.view = 'cargando'; S.p = {}; render();
    repo.db = dbVacia(); sync.snap = {}; sync.outbox = {}; sync.last = null;
    try{ await traerCambios(); }catch(e){ S.p = {det:'No hay señal para la primera carga. Conectate a internet y tocá Reintentar.', reintentar:true}; render(); return; }
    prepararDb(); sync.listo = true; detectarCambios(); guardarCache(); empezarUI(); subirPendientes();
  }
  if(!sync.escuchando){
    sync.escuchando = true;
    nube.escuchar(recibirRemoto);
    const refrescar = () => traerCambios().then(ch => { if(ch){ prepararDb(); guardarCache(); renderSuave(); } }).catch(() => {});
    setInterval(refrescar, 60000);
    window.addEventListener('online', () => { estadoSync(); subirPendientes(); refrescar(); });
    window.addEventListener('offline', estadoSync);
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ refrescar(); subirPendientes(); } });
  }
  if(esAdmin()) nube.perfiles().then(ps => { ps.forEach(asegurarUsuario); repo.guardar(); }).catch(() => {});
}
function empezarUI(){
  S.user = asegurarUsuario(sync.perfil); S.stack = []; S.p = {};
  const h = (location.hash || '').slice(1); S.view = TOP.includes(h) ? h : 'inicio';
  repo.guardar(); render(); estadoSync();
}
/* guardar: copia local inmediata y, un instante después, sube lo que cambió */
repo.guardar = function(){
  if(!sync.listo) return;
  guardarCache(); clearTimeout(sync.timer);
  sync.timer = setTimeout(() => { if(detectarCambios()){ guardarCache(); subirPendientes(); } else estadoSync(); }, 350);
};
function importarNube(d){
  const db = repo.db;
  ['items', 'clientes', 'equipos', 'ordenes', 'visitas'].forEach(c => { const m = new Map((db[c] || []).map(x => [x.id, x])); (d[c] || []).forEach(x => m.set(x.id, x)); db[c] = [...m.values()]; });
  db.sigNum = Math.max(db.sigNum || 1, d.sigNum || 1, ...db.ordenes.map(o => (o.num || 0) + 1));
  db.importado = {fecha:hoy(), ...d.resumen}; S.p.imp = null;
  repo.guardar(); toast('Subiendo ' + d.resumen.clientes + ' clientes y ' + d.resumen.ordenes + ' órdenes a la nube…'); render();
}

/* ===== pantallas de entrada ===== */
V.ingresar = () => {
  let email = S.p.email; if(email === undefined){ try{ email = localStorage.getItem('cdg-email') || ''; }catch(e){ email = ''; } }
  return `<div class="gut" style="background:var(--navy);color:var(--navy-ink);min-height:100%;flex:1;display:flex;flex-direction:column;gap:20px;padding-block:56px 28px">
    <div style="text-align:center;display:flex;flex-direction:column;gap:6px"><span style="font-size:28px;font-weight:800;letter-spacing:.5px">CLÍNICA <span style="color:var(--accent)">DEL</span> GYM</span><span style="color:var(--navy-muted);font-weight:600">Entrá con tu cuenta</span></div>
    <form id="f-ingresar" style="display:flex;flex-direction:column;gap:14px" novalidate>
      <label class="f"><span style="color:var(--navy-muted)">Email</span><input class="in" id="in-email" type="email" inputmode="email" autocomplete="username" value="${esc(email)}"></label>
      <label class="f"><span style="color:var(--navy-muted)">Contraseña</span><input class="in" id="in-pass" type="password" autocomplete="current-password"></label>
      ${S.p.error ? `<div style="color:#FFB27D;font-weight:800;text-align:center">${esc(S.p.error)}</div>` : ''}
      <button class="btn btn-main btn-big" ${S.p.entrando ? 'disabled' : ''}>${S.p.entrando ? 'Entrando…' : 'Entrar'}</button></form>
    <span style="color:var(--navy-muted);font-size:13px;font-weight:600;text-align:center;margin-top:auto">Se entra una sola vez: el celular recuerda la sesión.${nube ? '' : '<br><b style="color:#FFB27D">No se pudo cargar la conexión. Revisá la señal y recargá.</b>'}</span></div>`;
};
V.cargando = () => `<div class="gut" style="background:var(--navy);color:var(--navy-ink);min-height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center">
  <span style="font-size:24px;font-weight:800">CLÍNICA <span style="color:var(--accent)">DEL</span> GYM</span>
  <span style="color:var(--navy-muted);font-weight:700">${esc(S.p.det || 'Cargando tus datos…')}</span>
  ${S.p.reintentar ? '<button class="btn btn-main" data-a="reintentarCarga">Reintentar</button>' : ''}</div>`;

/* ===== historial de cambios (solo administrador) ===== */
const NOMBRE_COL = {clientes:'cliente', ordenes:'orden', items:'ítem', gastos:'gasto', visitas:'visita', equipos:'equipo', proveedores:'proveedor', abonos:'abono', desuso:'máquina en desuso', fichajes:'fichaje', adelantos:'adelanto', cargas:'carga de combustible', herramientas:'herramienta', usuarios:'empleado', modelos:'ficha técnica', piden:'pedido', meta:'configuración'};
function etiquetaDoc(col, d){
  d = d || {};
  if(col === 'ordenes') return 'orden #' + (d.num || '?') + (d.clienteId && repo.cliente(d.clienteId) ? ' de ' + nCorto(repo.cliente(d.clienteId)) : '');
  if(col === 'gastos') return (d.tipo === 'ingreso' ? 'ingreso ' : 'gasto ') + (d.categoria || '') + ' ' + plata(d.monto);
  if(col === 'visitas') return 'visita ' + (d.tipo || '') + (d.clienteId && repo.cliente(d.clienteId) ? ' a ' + nCorto(repo.cliente(d.clienteId)) : '');
  if(col === 'fichajes') return 'fichaje';
  if(col === 'meta') return 'configuración';
  return (NOMBRE_COL[col] || col) + (d.nombre ? ' ' + d.nombre : '');
}
function difCorta(a, b){
  if(!a || !b) return '';
  const fmt = v => typeof v === 'number' && v > 999 ? plata(v) : String(v);
  const ks = Object.keys(b).filter(k => (typeof b[k] !== 'object' || b[k] === null) && a[k] !== b[k] && !/^(snap|v)$/.test(k));
  const out = ks.slice(0, 3).map(k => `${k}: ${a[k] === undefined || a[k] === '' ? '—' : fmt(a[k])} → ${b[k] === '' ? '—' : fmt(b[k])}`);
  const obj = Object.keys(b).filter(k => b[k] && typeof b[k] === 'object' && JSON.stringify(a[k]) !== JSON.stringify(b[k]));
  if(obj.length) out.push('cambió ' + obj.slice(0, 3).join(', '));
  return out.join(' · ');
}
const haceTxt = iso => { const m = Math.floor((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'recién' : m < 60 ? 'hace ' + m + ' min' : m < 1440 ? 'hace ' + Math.floor(m / 60) + ' h' : fecha(iso) + ' ' + new Date(iso).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'}); };
V.historial = () => {
  if(!esAdmin()) return header({titulo:'Historial', atras:'Más'}) + `<div class="main gut"><div class="empty">Sin acceso.</div></div>` + nav();
  if(!S.p.pedido){ S.p.pedido = true; Promise.all([nube.historial(300), nube.perfiles()]).then(([rows, ps]) => { S.p.rows = rows; S.p.ps = ps; if(S.view === 'historial') render(); }).catch(() => { S.p.err = 'No se pudo cargar el historial. Revisá la señal.'; if(S.view === 'historial') render(); }); }
  const ps = S.p.ps || [], quien = id => (ps.find(p => p.id === id) || {}).nombre || 'Alguien', f = S.p.quien || '';
  const rows = (S.p.rows || []).filter(r => !(r.col === 'meta' && /^ejemplos|^interes7$|^sigNum$|^importado$|^avisosZona$|^capDia$/.test(r.doc_id)) && (!f || r.por === f));
  return header({kicker:'Solo administrador', titulo:'Historial de cambios', atras:'Más', extra:`<span style="color:var(--navy-muted);font-weight:700">Quién hizo qué y cuándo</span>`}) + `<div class="main gut">
    <div class="chips" style="flex-wrap:wrap"><button class="chip ${!f ? 'on' : ''}" data-a="histQuien" data-v="">Todos</button>${ps.map(p => `<button class="chip ${f === p.id ? 'on' : ''}" data-a="histQuien" data-v="${p.id}">${esc(p.nombre)}</button>`).join('')}</div>
    ${S.p.err ? `<div class="note">${esc(S.p.err)}</div>` : !S.p.rows ? '<div class="empty">Cargando…</div>' : rows.length ? `<div class="list">${rows.map(r => { const d = r.despues || r.antes || {}, dif = r.accion === 'cambió' ? difCorta(r.antes, r.despues) : '';
      return `<div class="li" style="flex-direction:column;align-items:stretch;gap:3px"><div class="between" style="gap:8px"><span class="b">${esc(quien(r.por))} <span style="font-weight:600">${esc(r.accion)}</span> ${esc(etiquetaDoc(r.col, d))}</span><span class="tiny muted b" style="flex-shrink:0">${haceTxt(r.cuando)}</span></div>${dif ? `<span class="tiny muted b">${esc(dif)}</span>` : ''}</div>`; }).join('')}</div>` : '<div class="empty">Sin cambios todavía.</div>'}
    <span class="tiny muted b">Se muestran los últimos 300 cambios.</span></div>` + nav();
};

/* ================= arranque ================= */
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(S.user && repo.db && TOP.includes(h) && h !== S.view) ir(h); });
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  S.view = 'cargando'; S.p = {}; render();
  if(!nube){ S.view = 'ingresar'; render(); return; }
  try{ const ses = await nube.sesion(); if(ses && ses.user){ await entrarConSesion(ses.user); return; } }
  catch(e){ const c = (() => { try{ return JSON.parse(localStorage.getItem(CACHE) || 'null'); }catch(e2){ return null; } })(); if(c && c.uid){ await entrarConSesion({id:c.uid}); return; } }
  S.view = 'ingresar'; S.p = {}; render();
})();
</script>
